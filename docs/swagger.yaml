  /e2ee/backup:
    delete:
      description: Deletes the encrypted key backup (e.g. when user wants to reset
        E2EE)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete E2EE Key Backup
      tags:
      - e2ee
    get:
      description: |-
        Retrieves the encrypted private key backup for the current user.
        The new device must decrypt it locally using the master password.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.UserKeyBackup'
        "204":
          description: No backup found — user has not set up a key backup yet
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get E2EE Key Backup
      tags:
      - e2ee
    post:
      consumes:
      - application/json
      description: |-
        Saves an encrypted backup of the user's private key to the cloud.
        The private key MUST be encrypted on the CLIENT SIDE with the user's master password before sending.
        The server only stores an encrypted blob and CANNOT decrypt it without the password.
      parameters:
      - description: Encrypted Key Backup
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SaveKeyBackupReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
