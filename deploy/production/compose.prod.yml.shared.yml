{
  "name": "workspace",
  "services": {
    "api": {
      "image": "${BACKEND_IMAGE:-ghcr.io/west6ide/workspace-backend:main}",
      "container_name": "workspace-api",
      "extra_hosts": ["host.docker.internal:host-gateway"],
      "restart": "unless-stopped",
      "env_file": [
        "/opt/workspace/.env"
      ],
      "environment": {
        "AI_DOCUMENT_WORKER_DISABLED": "true",
        "POSTGRES_HOST": "shared-postgres",
        "POSTGRES_PORT": "5432",
        "REDIS_HOST": "workspace-redis",
        "REDIS_PORT": "6379",
        "MINIO_ENDPOINT": "shared-minio:9000",
        "MINIO_EGRESS_ENDPOINT": "http://shared-minio:9000",
        "RABBITMQ_URL": "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@workspace-rabbitmq:5672/",
        "KEYCLOAK_URL": "http://workspace-keycloak:8080/auth",
        "APP_PUBLIC_URL": "${APP_PUBLIC_URL}",
        "AI_CONTEXT_ODO_URL": "${AI_CONTEXT_ODO_URL:-http://odo-bff:8080}",
        "AI_CONTEXT_MAIL_URL": "${AI_CONTEXT_MAIL_URL:-http://axis-mail-app-app-1:4100}",
        "SD_ACCESS_API_URL": "${SD_ACCESS_API_URL:-http://sd-backend:18080}",
        "IFORM_API_URL": "${IFORM_API_URL:-http://iform-backend:8081}",
        "GROWY_API_INTERNAL_URL": "${GROWY_API_INTERNAL_URL:-}",
        "GROWY_LMS_PUBLIC_URL": "${GROWY_LMS_PUBLIC_URL:-}",
        "GROWY_LMS_INTERNAL_URL": "${GROWY_LMS_INTERNAL_URL:-}",
        "COLLABORA_URL": "${COLLABORA_URL:-}",
        "KEYCLOAK_PUBLIC_URL": "${KEYCLOAK_PUBLIC_URL}",
        "KEYCLOAK_ISSUER": "${KEYCLOAK_ISSUER}",
        "POSTGRES_USER": "${SHARED_DB_USER:?SHARED_DB_USER required}",
        "POSTGRES_PASSWORD": "${SHARED_DB_PASSWORD:?SHARED_DB_PASSWORD required}",
        "POSTGRES_DB": "workspace",
        "POSTGRES_MAX_CONNS": "15",
        "POSTGRES_MIN_CONNS": "2",
        "MINIO_ACCESS_KEY": "${SHARED_S3_ACCESS_KEY:?SHARED_S3_ACCESS_KEY required}",
        "MINIO_SECRET_KEY": "${SHARED_S3_SECRET_KEY:?SHARED_S3_SECRET_KEY required}",
        "LOG_FORMAT": "console",
        "HTTP_WRITE_TIMEOUT": "360s"
      },
      "ports": [
        "127.0.0.1:18081:8080"
      ],
      "volumes": [
        "/opt/workspace/secrets:/run/workspace/secrets:ro",
        "/opt/workspace/certs:/custom-ca:ro"
      ],
      "depends_on": {
        "workspace-redis": {
          "condition": "service_healthy"
        },
        "workspace-rabbitmq": {
          "condition": "service_healthy"
        }
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "5"
        }
      },
      "networks": [
        "workspace",
        "shared"
      ]
    },
    "ai-document-worker": {
      "image": "${BACKEND_IMAGE:-ghcr.io/west6ide/workspace-backend:main}",
      "container_name": "workspace-ai-document-worker",
      "restart": "unless-stopped",
      "env_file": [
        "/opt/workspace/.env"
      ],
      "environment": {
        "AI_DOCUMENT_WORKER_ONLY": "true",
        "POSTGRES_HOST": "shared-postgres",
        "POSTGRES_PORT": "5432",
        "REDIS_HOST": "workspace-redis",
        "REDIS_PORT": "6379",
        "MINIO_ENDPOINT": "shared-minio:9000",
        "MINIO_EGRESS_ENDPOINT": "http://shared-minio:9000",
        "RABBITMQ_URL": "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@workspace-rabbitmq:5672/",
        "KEYCLOAK_URL": "http://workspace-keycloak:8080/auth",
        "APP_PUBLIC_URL": "${APP_PUBLIC_URL}",
        "KEYCLOAK_PUBLIC_URL": "${KEYCLOAK_PUBLIC_URL}",
        "KEYCLOAK_ISSUER": "${KEYCLOAK_ISSUER}",
        "POSTGRES_USER": "${SHARED_DB_USER:?SHARED_DB_USER required}",
        "POSTGRES_PASSWORD": "${SHARED_DB_PASSWORD:?SHARED_DB_PASSWORD required}",
        "POSTGRES_DB": "workspace",
        "POSTGRES_MAX_CONNS": "15",
        "POSTGRES_MIN_CONNS": "2",
        "MINIO_ACCESS_KEY": "${SHARED_S3_ACCESS_KEY:?SHARED_S3_ACCESS_KEY required}",
        "MINIO_SECRET_KEY": "${SHARED_S3_SECRET_KEY:?SHARED_S3_SECRET_KEY required}",
        "LOG_FORMAT": "console"
      },
      "depends_on": {
        "workspace-redis": {
          "condition": "service_healthy"
        },
        "workspace-rabbitmq": {
          "condition": "service_healthy"
        }
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "5"
        }
      },
      "networks": [
        "workspace",
        "shared"
      ]
    },
    "frontend": {
      "image": "${FRONTEND_IMAGE:-ghcr.io/west6ide/workspace-front:main}",
      "container_name": "workspace-frontend",
      "restart": "unless-stopped",
      "ports": [
        "127.0.0.1:13000:80"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/health"
        ],
        "interval": "30s",
        "timeout": "5s",
        "retries": 3
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "5"
        }
      },
      "networks": [
        "workspace"
      ]
    },
    "workspace-livekit": {
      "image": "${LIVEKIT_IMAGE:-livekit/livekit-server:v1.13.7}",
      "container_name": "workspace-livekit",
      "restart": "unless-stopped",
      "environment": {
        "LIVEKIT_CONFIG": "port: 7880\nlog_level: info\nrtc:\n  tcp_port: 7881\n  udp_port: 7882\n  use_external_ip: true\nkeys:\n  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}\nwebhook:\n  api_key: ${LIVEKIT_API_KEY}\n  urls:\n    - https://teamspace.kz/api/v1/calls/webhook\n"
      },
      "ports": [
        "127.0.0.1:17880:7880",
        "7881:7881",
        "7882:7882/udp"
      ],
      "networks": [
        "workspace"
      ]
    },
    "workspace-redis": {
      "image": "redis:7-alpine",
      "container_name": "workspace-redis",
      "restart": "unless-stopped",
      "environment": {
        "REDIS_PASSWORD": "${REDIS_PASSWORD}"
      },
      "command": [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}"
      ],
      "volumes": [
        "workspace_redis_data:/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 10
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "5"
        }
      },
      "networks": [
        "workspace"
      ]
    },
    "workspace-rabbitmq": {
      "image": "rabbitmq:3.13-management-alpine",
      "container_name": "workspace-rabbitmq",
      "restart": "unless-stopped",
      "environment": {
        "RABBITMQ_DEFAULT_USER": "${RABBITMQ_USER}",
        "RABBITMQ_DEFAULT_PASS": "${RABBITMQ_PASSWORD}"
      },
      "volumes": [
        "workspace_rabbitmq_data:/var/lib/rabbitmq"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "rabbitmq-diagnostics",
          "ping"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 10
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "5"
        }
      },
      "networks": [
        "workspace"
      ]
    },
    "keycloak-postgres": {
      "image": "postgres:16-alpine",
      "container_name": "workspace-keycloak-postgres",
      "restart": "unless-stopped",
      "environment": {
        "POSTGRES_USER": "keycloak",
        "POSTGRES_PASSWORD": "${KEYCLOAK_DB_PASSWORD}",
        "POSTGRES_DB": "keycloak"
      },
      "volumes": [
        "keycloak_postgres_data:/var/lib/postgresql/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U keycloak -d keycloak"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 10
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "5"
        }
      },
      "networks": [
        "workspace"
      ]
    },
    "workspace-keycloak": {
      "image": "quay.io/keycloak/keycloak:24.0.0",
      "container_name": "workspace-keycloak",
      "restart": "unless-stopped",
      "command": [
        "start"
      ],
      "environment": {
        "KC_DB": "postgres",
        "KC_FEATURES": "token-exchange,admin-fine-grained-authz",
        "KC_DB_URL": "jdbc:postgresql://keycloak-postgres:5432/keycloak",
        "KC_DB_USERNAME": "keycloak",
        "KC_DB_PASSWORD": "${KEYCLOAK_DB_PASSWORD}",
        "KC_HOSTNAME": "${KEYCLOAK_HOSTNAME}",
        "KC_HOSTNAME_ADMIN": "${KEYCLOAK_HOSTNAME}",
        "KC_HTTP_RELATIVE_PATH": "/auth",
        "KC_PROXY_HEADERS": "xforwarded",
        "KC_HTTP_ENABLED": "true",
        "KEYCLOAK_ADMIN": "${KEYCLOAK_ADMIN_USER}",
        "KEYCLOAK_ADMIN_PASSWORD": "${KEYCLOAK_ADMIN_PASSWORD}",
        "JAVA_OPTS_KC_HEAP": "-Xms256m -Xmx768m"
      },
      "ports": [
        "127.0.0.1:18082:8080"
      ],
      "depends_on": {
        "keycloak-postgres": {
          "condition": "service_healthy"
        }
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "5"
        }
      },
      "networks": [
        "workspace"
      ],
      "mem_limit": "1536m",
      "memswap_limit": "2048m"
    }
  },
  "volumes": {
    "workspace_redis_data": null,
    "workspace_rabbitmq_data": null,
    "keycloak_postgres_data": null
  },
  "networks": {
    "workspace": {
      "driver": "bridge"
    },
    "shared": {
      "external": true,
      "name": "shared_infra"
    }
  }
}
