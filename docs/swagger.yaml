      tags:
      - notes
    post:
      consumes:
      - multipart/form-data
      description: |-
        Creates a note. Accepts both application/json and multipart/form-data (for file uploads).
        Use application/json when no file is attached. The content_doc field follows the rich document schema.
      parameters:
      - description: Title
        in: formData
        name: title
        type: string
      - description: Plain text content (legacy)
        in: formData
        name: content
        type: string
      - description: Rich content JSON (content_doc schema)
        in: formData
        name: content_doc
        type: string
      - description: 'Note type: text|checklist|rich'
        in: formData
        name: type
        type: string
      - description: Folder UUID
        in: formData
        name: folder_id
        type: string
      - description: Pin the note
        in: formData
        name: is_pinned
        type: boolean
      - description: Archive the note
        in: formData
        name: is_archived
        type: boolean
      - description: Checklist items JSON array (legacy)
        in: formData
        name: checklist_items
        type: string
      - description: File attachments (repeat for multiple)
        in: formData
        name: files
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Note'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create note
      tags:
      - notes
