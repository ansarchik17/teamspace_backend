  /whiteboards/ws/{roomId}:
    get:
      description: |-
        Upgrades the request to WebSocket for collaborative whiteboard events. Authentication is inherited from the protected route and supports the same Authorization header, access_token cookie, and token/access_token query param flow already used by the project for WebSocket auth.
        Message types: init, draw, undo, clear, cursor, ping, pong, error.
      parameters:
      - description: Board ID (UUID)
        in: path
        name: roomId
        required: true
        type: string
      - description: Access token (alternative to header/cookie)
        in: query
        name: token
        type: string
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Whiteboard WebSocket connection
      tags:
      - whiteboards
  /ws:
    get:
      description: Establish WebSocket connection for notifications, calls, presence
        and kanban updates
      parameters:
      - description: Access token (alternative to header)
        in: query
        name: token
        type: string
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: WebSocket connection
      tags:
      - websocket
securityDefinitions:
