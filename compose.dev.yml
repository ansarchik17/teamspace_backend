# Local dependencies for a Go API running on the host. Explicit -f prevents
# docker-compose.override.yml from changing the local configuration.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASS:-admin}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:18082}
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-18082}:8080"
    volumes:
      - keycloak:/opt/keycloak/data
      - ./docker/keycloak-dev/Workspace-realm.json:/opt/keycloak/data/import/Workspace-realm.json:ro
    healthcheck:
      # The official image has Bash but no curl. Check the imported realm, not
      # merely the process, before allowing the Go API to initialise its JWKS.
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /realms/Workspace/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]'
      start_period: 30s
      interval: 3s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workspace}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # The upstream image can reject anonymous pulls. Build the same official
    # source commit already pinned by deploy/production/ci/minio-test-binary.py.
    image: teamspace-dev-minio:0d7408fc9969
    pull_policy: build
    build:
      context: ./docker/minio-dev
      dockerfile: Dockerfile
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${TEAMSPACE_MINIO_PORT:-19000}:9000"
      - "127.0.0.1:19002:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  keycloak:
  postgres:
  redis:
  minio:
