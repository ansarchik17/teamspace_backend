name: workspace

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    image: ${BACKEND_IMAGE:-ghcr.io/west6ide/workspace-backend:main}
    container_name: workspace-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    env_file:
      - /opt/workspace/.env
    environment:
      LOG_FORMAT: console
      AI_DOCUMENT_WORKER_DISABLED: "true"
      HTTP_WRITE_TIMEOUT: 360s
      POSTGRES_HOST: workspace-postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: workspace-redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: workspace-minio:9000
      MINIO_EGRESS_ENDPOINT: http://workspace-minio:9000
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@workspace-rabbitmq:5672/
      KEYCLOAK_URL: http://workspace-keycloak:8080/auth
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      AI_CONTEXT_ODO_URL: ${AI_CONTEXT_ODO_URL:-http://odo-bff:8080}
      AI_CONTEXT_MAIL_URL: ${AI_CONTEXT_MAIL_URL:-http://axis-mail-app-app-1:4100}
      SD_ACCESS_API_URL: ${SD_ACCESS_API_URL:-http://sd-backend:18080}
      IFORM_API_URL: ${IFORM_API_URL:-http://iform-backend:8081}
      GROWY_API_INTERNAL_URL: ${GROWY_API_INTERNAL_URL:-}
      GROWY_LMS_PUBLIC_URL: ${GROWY_LMS_PUBLIC_URL:-}
      GROWY_LMS_INTERNAL_URL: ${GROWY_LMS_INTERNAL_URL:-}
      COLLABORA_URL: ${COLLABORA_URL:-}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - /opt/workspace/secrets:/run/workspace/secrets:ro
      - /opt/workspace/certs:/custom-ca:ro
    depends_on:
      workspace-postgres:
        condition: service_healthy
      workspace-redis:
        condition: service_healthy
      workspace-rabbitmq:
        condition: service_healthy
      workspace-minio:
        condition: service_healthy
    logging: *default-logging
    networks: [workspace]

  ai-document-worker:
    image: ${BACKEND_IMAGE:-ghcr.io/west6ide/workspace-backend:main}
    container_name: workspace-ai-document-worker
    restart: unless-stopped
    env_file:
      - /opt/workspace/.env
    environment:
      LOG_FORMAT: console
      AI_DOCUMENT_WORKER_ONLY: "true"
      POSTGRES_HOST: workspace-postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: workspace-redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: workspace-minio:9000
      MINIO_EGRESS_ENDPOINT: http://workspace-minio:9000
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@workspace-rabbitmq:5672/
      KEYCLOAK_URL: http://workspace-keycloak:8080/auth
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
    depends_on:
      workspace-postgres:
        condition: service_healthy
      workspace-redis:
        condition: service_healthy
      workspace-rabbitmq:
        condition: service_healthy
      workspace-minio:
        condition: service_healthy
    logging: *default-logging
    networks: [workspace]

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/west6ide/workspace-front:main}
    container_name: workspace-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks: [workspace]

  workspace-livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.13.7}
    container_name: workspace-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - https://teamspace.kz/api/v1/calls/webhook
    ports:
      - "127.0.0.1:17880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks: [workspace]

  workspace-postgres:
    image: postgres:16-alpine
    container_name: workspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - workspace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [workspace]

  workspace-redis:
    image: redis:7-alpine
    container_name: workspace-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - workspace_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [workspace]

  workspace-minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e}
    container_name: workspace-minio
    restart: unless-stopped
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - workspace_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
    logging: *default-logging
    networks: [workspace]

  workspace-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: workspace-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - workspace_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 10
    logging: *default-logging
    networks: [workspace]

  keycloak-postgres:
    image: postgres:16-alpine
    container_name: workspace-keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [workspace]

  workspace-keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: workspace-keycloak
    restart: unless-stopped
    mem_limit: 1536m
    memswap_limit: 2048m
    command: ["start"]
    environment:
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx768m"
      KC_DB: postgres
      KC_FEATURES: "token-exchange,admin-fine-grained-authz"
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_HOSTNAME}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:18082:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    logging: *default-logging
    networks: [workspace]

volumes:
  workspace_postgres_data:
  workspace_redis_data:
  workspace_minio_data:
  workspace_rabbitmq_data:
  keycloak_postgres_data:

networks:
  workspace:
    driver: bridge
